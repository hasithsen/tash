# Alternative to tash-hotkeys: triggerhappy (apt install triggerhappy)
# Events fire on key press (1). Repeat (2) also useful for hold-to-ramp.
KEY_BRIGHTNESSUP    1   /usr/local/bin/tash-ctl brightness up
KEY_BRIGHTNESSUP    2   /usr/local/bin/tash-ctl brightness up
KEY_BRIGHTNESSDOWN  1   /usr/local/bin/tash-ctl brightness down
KEY_BRIGHTNESSDOWN  2   /usr/local/bin/tash-ctl brightness down
KEY_VOLUMEUP        1   /usr/local/bin/tash-ctl volume up
KEY_VOLUMEUP        2   /usr/local/bin/tash-ctl volume up
KEY_VOLUMEDOWN      1   /usr/local/bin/tash-ctl volume down
KEY_VOLUMEDOWN      2   /usr/local/bin/tash-ctl volume down
KEY_MUTE            1   /usr/local/bin/tash-ctl volume toggle
KEY_MICMUTE         1   /usr/local/bin/tash-ctl volume toggle
